{% extends "base.html" %}

{% block title %}Data Explorer{% endblock %}
{% block page_title %}Ingested Data Explorer{% endblock %}

{% block content %}
<section class="panel" style="flex: 1;">
    <div class="section-header">
        <h2 style="font-size: 1rem; font-weight: 600;">Data Overview</h2>
        <div class="filters">
            <label class="toggle">
                <input type="checkbox" id="remote-only">
                <span class="slider"></span>
                <span class="toggle-label">Remote Only</span>
            </label>
        </div>
    </div>
    <div class="table-container">
        <table class="jobs-table">
            <thead>
                <tr>
                    <th>Role</th>
                    <th>Company</th>
                    <th>Source</th>
                    <th>Salary</th>
                    <th>Posted</th>
                </tr>
            </thead>
            <tbody id="jobs-table-body">
                <!-- Populated by JS -->
            </tbody>
        </table>
    </div>
    <div class="pagination">
        <button class="btn btn-ghost" id="prev-page" disabled>Previous</button>
        <span id="page-indicator" class="mono">Page 1</span>
        <button class="btn btn-ghost" id="next-page">Next</button>
    </div>
</section>
{% endblock %}

{% block extra_scripts %}
<script>
    // Only init jobs fetching
    fetchJobs();
</script>
{% endblock %}
