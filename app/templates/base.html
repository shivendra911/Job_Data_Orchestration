<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <title>{% block title %}IngestPipe{% endblock %}</title>
    <link href="/static/landing.css" rel="stylesheet"/>
    {% block head %}{% endblock %}
</head>
<body class="landing">

    <nav class="l-nav">
        <div class="l-nav-inner">
            <a href="/" class="l-nav-brand">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>
                IngestPipe
            </a>
            <div class="l-nav-links">
                <a href="/" data-text="Home" {% if active_page == 'home' %}class="active"{% endif %}>Home</a>
                <a href="/search" data-text="Find Jobs" {% if active_page == 'search' %}class="active"{% endif %}>Find Jobs</a>
                <a href="/system" data-text="System" {% if active_page == 'system' %}class="active"{% endif %}>System</a>
                <a href="/docs" data-text="Docs" {% if active_page == 'docs' %}class="active"{% endif %}>Docs</a>
                <a href="/app" class="btn-primary">Open Dashboard</a>
            </div>
        </div>
    </nav>

    {% block content %}
    {% endblock %}

    {% block footer %}
    <footer class="l-footer container" style="border-top: 1px solid var(--l-border);">
        <div class="l-footer-brand">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>
            IngestPipe
        </div>
        <p class="l-footer-tag">Data Orchestration & Sync</p>
        <div class="l-footer-links">
            <a href="/search">Find Jobs</a> &middot; 
            <a href="/system">System</a> &middot; 
            <a href="/docs">Documentation</a>
        </div>
        <p class="l-footer-copy">&copy; 2026 Ingestion Pipeline Systems</p>
    </footer>
    {% endblock %}
    
    {% block scripts %}{% endblock %}
</body>
</html>
