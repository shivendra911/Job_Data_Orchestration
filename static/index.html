<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Ingestion Platform | Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="background-mesh"></div>
    
    <div class="app-container">
        <header class="glass-panel main-header">
            <div class="logo">
                <h1>Ingest<span>Hub</span></h1>
                <p>Data Orchestration Pipeline</p>
            </div>
            <div class="header-stats" id="global-stats">
                <div class="stat-badge">
                    <span class="label">System Status</span>
                    <span class="value success">Healthy</span>
                </div>
            </div>
        </header>

        <main class="dashboard-grid">
            <!-- Sources Column -->
            <section class="sources-panel glass-panel">
                <div class="section-header">
                    <h2>Active Sources</h2>
                    <button id="refresh-sources" class="btn btn-icon" title="Refresh Sources">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/></svg>
                    </button>
                </div>
                <div id="sources-list" class="source-list">
                    <!-- Populated by JS -->
                    <div class="loading-pulse"></div>
                    <div class="loading-pulse"></div>
                </div>
            </section>

            <!-- Jobs Column -->
            <section class="jobs-panel glass-panel">
                <div class="section-header">
                    <h2>Recent Ingested Jobs</h2>
                    <div class="filters">
                        <label class="toggle">
                            <input type="checkbox" id="remote-only">
                            <span class="slider"></span>
                            <span class="toggle-label">Remote Only</span>
                        </label>
                    </div>
                </div>
                <div class="table-container">
                    <table class="jobs-table">
                        <thead>
                            <tr>
                                <th>Role</th>
                                <th>Company</th>
                                <th>Source</th>
                                <th>Salary</th>
                                <th>Posted</th>
                            </tr>
                        </thead>
                        <tbody id="jobs-table-body">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
                <div class="pagination">
                    <button class="btn btn-ghost" id="prev-page" disabled>Previous</button>
                    <span id="page-indicator">Page 1</span>
                    <button class="btn btn-ghost" id="next-page">Next</button>
                </div>
            </section>
        </main>
    </div>

    <!-- Template for Source Card -->
    <template id="source-template">
        <div class="source-card">
            <div class="source-header">
                <h3 class="source-name"></h3>
                <span class="status-indicator"></span>
            </div>
            <div class="source-meta">
                <span class="adapter-type"></span>
                <span class="last-run"></span>
            </div>
            <div class="source-actions">
                <button class="btn btn-primary btn-trigger">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                    Trigger Ingestion
                </button>
            </div>
        </div>
    </template>

    <script src="/static/app.js"></script>
</body>
</html>
