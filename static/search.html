<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Jobs - Ingestion Pipeline</title>
    <link rel="stylesheet" href="/static/site.css">
    <script>
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'brutalist') {
            document.documentElement.setAttribute('data-theme', 'brutalist');
        }
    </script>
    <style>
        .search-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 2rem;
            margin-top: 2rem;
            align-items: start;
        }

        .filter-sidebar {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-subtle);
            padding: 1.5rem;
            border-radius: 8px;
            position: sticky;
            top: 6rem;
        }

        .filter-group {
            margin-bottom: 1.5rem;
        }

        .filter-group:last-child {
            margin-bottom: 0;
        }

        .filter-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .filter-group input[type="text"],
        .filter-group input[type="number"],
        .filter-group select {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--bg-main);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            border-radius: 4px;
            font-family: var(--font-sans);
            font-size: 0.9rem;
        }

        .filter-group input[type="text"]:focus,
        .filter-group input[type="number"]:focus,
        .filter-group select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .checkbox-group input[type="checkbox"] {
            accent-color: var(--accent);
            width: 16px;
            height: 16px;
        }

        .checkbox-group label {
            margin-bottom: 0;
            font-weight: 400;
            font-size: 0.9rem;
        }

        .job-card {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-subtle);
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            transition: border-color 0.2s;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .job-card:hover {
            border-color: var(--text-muted);
        }

        .job-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
        }

        .job-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--accent);
            text-decoration: none;
        }

        .job-title:hover {
            text-decoration: underline;
            opacity: 1;
        }

        .job-company {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-main);
        }

        .job-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .job-meta-item {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .job-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .tag {
            background-color: var(--bg-main);
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-family: var(--font-mono);
        }

        .search-stats {
            margin-bottom: 1rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .pagination-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            margin-top: 2rem;
        }

        .pagination-controls button {
            padding: 0.5rem 1rem;
        }

        #loading-indicator {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }

        @media (max-width: 768px) {
            .search-layout {
                grid-template-columns: 1fr;
            }
            .filter-sidebar {
                position: static;
            }
        }
    </style>
</head>
<body>
    <nav class="site-nav">
        <a href="/" class="site-nav-logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
            IngestPipe
        </a>
        <div class="site-nav-links">
            <a href="/search" class="active">Find Jobs</a>
            <a href="/pricing">Pricing</a>
            <a href="/docs">Documentation</a>
            <a href="/app" class="btn-primary">Dashboard</a>
        </div>
    </nav>

    <main class="container">
        <div class="search-layout">
            <aside class="filter-sidebar">
                <div class="filter-group">
                    <label for="search-input">Search</label>
                    <input type="text" id="search-input" placeholder="Title, company, or keywords...">
                </div>
                
                <div class="filter-group">
                    <label for="location-input">Location</label>
                    <input type="text" id="location-input" placeholder="City, state, or country...">
                </div>

                <div class="filter-group checkbox-group">
                    <input type="checkbox" id="remote-checkbox">
                    <label for="remote-checkbox">Remote Only</label>
                </div>

                <div class="filter-group">
                    <label for="salary-input">Minimum Salary (USD)</label>
                    <input type="number" id="salary-input" placeholder="e.g. 50000" step="1000">
                </div>
                
                <div class="filter-group">
                    <button id="reset-filters" class="btn-secondary" style="width: 100%;">Reset Filters</button>
                </div>
            </aside>

            <section class="results-area">
                <div class="search-stats" id="search-stats">
                    Loading jobs...
                </div>

                <div id="loading-indicator">
                    Fetching latest data from pipeline...
                </div>

                <div id="jobs-container">
                    <!-- Job cards rendered here by JS -->
                </div>

                <div class="pagination-controls" id="pagination-controls" style="display: none;">
                    <button id="prev-page" class="btn-secondary" disabled>Previous</button>
                    <span id="page-info" style="font-family: var(--font-mono); font-size: 0.9rem;">Page 1</span>
                    <button id="next-page" class="btn-secondary">Next</button>
                </div>
            </section>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 Ingestion Pipeline Systems. Built for engineering precision.</p>
        </div>
    </footer>

    <script src="/static/search.js"></script>
</body>
</html>
